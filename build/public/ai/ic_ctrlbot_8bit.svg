<?xml version="1.0" encoding="utf-8"?>
<!--
  Pixel-art CTRLbot mark, used only by the DOS terminal theme (body.dos-mode).

  Derived from _Graphics/_Icon/8bit/ctrlbot_8bit.svg with two changes: the opaque
  white background rect is dropped so the mark sits directly on the terminal
  black, and the artwork is filled with the phosphor green rather than the
  default black.

  The colour is baked in because an SVG loaded through an img element is an
  isolated document: it cannot read the page's phosphor custom property. If the
  terminal colour changes, change it in BOTH places, the dos-fg custom property
  in public/index.html and the fill below.

  (Careful editing this comment: XML forbids a double hyphen inside a comment,
  and a stray one silently breaks the whole file into an unrenderable image.)
-->
